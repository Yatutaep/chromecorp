name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Что лежит в репозитории
        run: |
          ls -la
          find . -maxdepth 3 -not -path './.git/*' | head -50
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.5 }
      - name: Сборка
        run: |
          FILE=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "ОШИБКА: settings.gradle не найден. Файлы проекта не загружены в репозиторий."
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Проект найден в: $DIR"
          cd "$DIR"
          gradle build
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/libs/chromecorp-0.1.0.jar "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: chromecorp-jar
          path: out/chromecorp-0.1.0.jar
